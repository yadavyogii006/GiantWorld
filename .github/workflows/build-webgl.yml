name: Build WebGL

on:
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main, master]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build-webgl.yml'

jobs:
  build:
    name: Build WebGL for itch.io
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 2022.3.50f1
          targetPlatform: WebGL
          buildsPath: build

      - name: Zip for itch.io
        run: |
          cd build/WebGL
          zip -r ../../GiantWorld-WebGL.zip .
          echo "Zip contents:"
          unzip -l ../../GiantWorld-WebGL.zip | head -20

      - name: Upload WebGL folder
        uses: actions/upload-artifact@v4
        with:
          name: GiantWorld-WebGL
          path: build/WebGL
          retention-days: 14

      - name: Upload itch.io zip
        uses: actions/upload-artifact@v4
        with:
          name: GiantWorld-WebGL-zip
          path: GiantWorld-WebGL.zip
          retention-days: 14
