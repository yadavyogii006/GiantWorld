name: Build WebGL

on:
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches: [main, master]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build-webgl.yml'

jobs:
  build:
    name: Build WebGL for itch.io
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          # Prefer UNITY_SERIAL (extract from .ulf) over UNITY_LICENSE for CI — see DEPLOY.md
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2022.3.50f1
          targetPlatform: WebGL
          buildsPath: build

      - name: Install brotli (for .unityweb decompression)
        run: sudo apt-get update && sudo apt-get install -y brotli

      - name: Normalize and decompress WebGL for itch.io
        run: |
          chmod +x scripts/fix-webgl-build.sh
          echo "--- Raw build tree ---"
          find build -maxdepth 4 -type f | head -40

          if [ -f build/WebGL/WebGL/index.html ]; then
            WEBGL_ROOT=build/WebGL/WebGL
          elif [ -f build/WebGL/index.html ]; then
            WEBGL_ROOT=build/WebGL
          else
            WEBGL_ROOT="$(find build -name index.html | head -1 | xargs dirname)"
          fi

          if [ -z "$WEBGL_ROOT" ] || [ ! -f "$WEBGL_ROOT/index.html" ]; then
            echo "Could not locate WebGL index.html under build/" >&2
            exit 1
          fi

          ./scripts/fix-webgl-build.sh "$WEBGL_ROOT"

          if [ "$WEBGL_ROOT" = "build/WebGL/WebGL" ]; then
            mv build/WebGL/WebGL /tmp/GiantWorld-WebGL-out
            rm -rf build/WebGL
            mv /tmp/GiantWorld-WebGL-out build/WebGL
          fi

          echo "--- Build files after decompress ---"
          ls -la build/WebGL/Build/
          grep -E "dataUrl|frameworkUrl|codeUrl" build/WebGL/index.html

      - name: Zip for itch.io
        run: |
          cd build/WebGL
          zip -r ../../GiantWorld-WebGL.zip .
          echo "Zip contents:"
          unzip -l ../../GiantWorld-WebGL.zip | head -20

      - name: Upload WebGL folder
        uses: actions/upload-artifact@v4
        with:
          name: GiantWorld-WebGL
          path: build/WebGL
          retention-days: 14

      - name: Upload itch.io zip
        uses: actions/upload-artifact@v4
        with:
          name: GiantWorld-WebGL-zip
          path: GiantWorld-WebGL.zip
          retention-days: 14
