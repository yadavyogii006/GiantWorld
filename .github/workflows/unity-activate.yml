name: Unity License Setup

# Generates a .alf file using Docker — no Unity 6 version bug, no email/password needed for this step.
# After download: upload .alf at https://license.unity3d.com/manual → get .ulf → add as UNITY_LICENSE secret.
# See DEPLOY.md Step 3.

on:
  workflow_dispatch:

env:
  # Personal licenses work across Unity versions — must match build workflow version
  UNITY_VERSION: 2022.3.50f1
  GAMECI_TAG: ubuntu-2022.3.50f1-webgl-3

jobs:
  activation-file:
    name: Generate Unity activation file (.alf)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Unity Docker image
        run: |
          echo "Pulling unityci/editor:${{ env.GAMECI_TAG }}"
          docker pull "unityci/editor:${{ env.GAMECI_TAG }}"

      - name: Create manual activation file
        run: |
          mkdir -p activation
          # --entrypoint bypasses game-ci entrypoint.sh which was treating -batchmode as a command
          docker run --rm \
            --hostname unity-docker-builder \
            --entrypoint unity-editor \
            -u root \
            -v "${{ github.workspace }}/activation:/output" \
            -w /output \
            "unityci/editor:${{ env.GAMECI_TAG }}" \
            -batchmode \
            -nographics \
            -quit \
            -logFile /output/unity.log \
            -createManualActivationFile
          echo "--- Log ---"
          cat activation/unity.log || true
          echo "--- Files ---"
          ls -la activation/
          if ! ls activation/*.alf 1>/dev/null 2>&1; then
            echo "❌ No .alf file created. Check log above."
            exit 1
          fi

      - name: Upload activation file (.alf)
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: activation/*.alf
          retention-days: 3

      - name: Next steps
        run: |
          echo "============================================"
          echo "✅ Download artifact: Unity-Activation-File"
          echo ""
          echo "1. Unzip → you get a .alf file"
          echo "2. Open https://license.unity3d.com/manual"
          echo "3. Sign in → upload .alf → download .ulf"
          echo "4. Open .ulf in TextEdit → Select All → Copy"
          echo "5. GitHub → Settings → Secrets → New secret:"
          echo "   Name:  UNITY_LICENSE"
          echo "   Value: paste full .ulf text (NOT base64)"
          echo ""
          echo "Also add (required for Build WebGL):"
          echo "   UNITY_EMAIL    = your Unity account email"
          echo "   UNITY_PASSWORD = your Unity password"
          echo ""
          echo "6. Run 'Build WebGL' workflow"
          echo "============================================"
